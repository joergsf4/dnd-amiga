# Builds the floppy disk image on every push to main and publishes the browser version
# (vAmigaWeb, AROS instead of a real Kickstart ROM) on GitHub Pages.
name: Web version (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the disk image (amiga-gcc in Docker)
        # the container's user isn't the runner's: let it write into the checkout
        run: chmod -R a+rwX . && ./build.sh
      - name: Assemble the web player
        run: tools/make_web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
